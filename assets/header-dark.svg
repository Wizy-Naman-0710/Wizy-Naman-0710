<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="ttl desc">
<title id="ttl">Naman Murarka</title>
<desc id="desc">Terminal: naman murarka, B.E. Computer Science at BITS Pilani, Head of Operations at SUTT. cat ~/.plan prints: write the backend, terraform the cloud, bribe the agents (for science).</desc>
<style>
@font-face{font-family:"JBM";font-weight:400;src:url(data:font/woff;base64,) format("woff")}
@font-face{font-family:"JBM";font-weight:800;src:url(data:font/woff;base64,) format("woff")}
text{font-family:"JBM",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-ligatures:none}
.t{font-size:16px;fill:#E6EDF3}
.a{fill:#FFB000}
.d{fill:#8B949E}
.o{fill:#8B949E}
.bar{font-size:12.5px;fill:#8B949E;letter-spacing:.02em}
.name{font-size:64px;font-weight:800;fill:#E6EDF3;letter-spacing:-.02em}
.sub{font-size:15px;fill:#8B949E}
.cover{fill:#0D1117;animation-name:wipe;animation-fill-mode:both}
.r{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
.cur{fill:#FFB000;animation:blink 1.1s steps(1,end) infinite}
@keyframes wipe{from{transform:translateX(0)}to{transform:translateX(var(--w))}}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.r,.cur{animation:none}.cover{display:none}}
</style>
<rect width="960" height="414" rx="14" fill="#0D1117"/>
